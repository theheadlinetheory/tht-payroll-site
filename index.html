<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>THT Payroll</title>
<style>
  :root { --font: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
          --border:#e5e7eb; --text:#111827; --text-muted:#6b7280; --bg-card:#fff; --purple:#7c3aed; }
  * { box-sizing: border-box; }
  body { margin:0; font-family:var(--font); color:var(--text); background:#f9fafb; font-size:14px; }
  #app { padding:20px; max-width:1200px; margin:0 auto; }
  table { border-collapse:collapse; width:100%; background:var(--bg-card); }
  th,td { padding:8px 10px; border-bottom:1px solid var(--border); text-align:left; font-size:13px; }
  th { font-weight:600; color:var(--text-muted); font-size:11px; text-transform:uppercase; }
  .btn { padding:6px 12px; border:1px solid var(--border); border-radius:6px; background:#fff;
         font-size:13px; font-family:var(--font); cursor:pointer; }
  .btn-ghost { border:none; background:none; }
  .btn-primary { background:var(--purple); border-color:var(--purple); color:#fff; font-weight:600; }
  .card { background:var(--bg-card); border:1px solid var(--border); border-radius:10px; padding:18px; margin-bottom:16px; }
  .grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(180px,1fr)); gap:10px; }
  .grid label { display:flex; flex-direction:column; gap:3px; font-size:11px; color:var(--text-muted); }
  .grid input, .grid select { padding:7px 9px; border:1px solid var(--border); border-radius:6px; font-size:13px; font-family:var(--font); color:var(--text); }
</style>
</head>
<body>
<div id="app"></div>
<script type="module" src="./js/main.js"></script>
</body>
</html>
